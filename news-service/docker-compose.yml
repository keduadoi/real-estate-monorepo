version: '3.8'

# =============================================================================
# News Service - Standalone Docker Compose
# =============================================================================
# For development/testing of news-service in isolation
# Usage: docker-compose up -d
# =============================================================================

services:
  news-db:
    image: postgres:16-alpine
    container_name: news-db
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - news-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  news-service:
    build:
      context: ..
      dockerfile: news-service/Dockerfile
    container_name: news-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: news-db
      DB_PORT: 5432
      DB_NAME: newsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      news-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  news-db-data:
