# Production values for Auth Service
# High availability, security hardening, and performance tuning

namespace:
  name: real-estate
  create: true

authService:
  name: auth-service
  replicaCount: 3  # Minimum 3 for HA

  image:
    repository: auth-service
    pullPolicy: Always  # Always pull in production to get latest security patches
    tag: ""  # Set via CI/CD pipeline

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Anti-affinity to spread pods across nodes
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-service
          topologyKey: kubernetes.io/hostname

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Topology spread for zone redundancy
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: auth-service

  env:
    serverPort: 8081
    springProfilesActive: prod
    # Database - use external secrets
    dbHost: auth-postgres
    dbPort: 5432
    dbName: authdb
    # JVM tuning
    javaOpts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -Xms512m -Xmx768m"

  # External secrets for sensitive data
  externalSecrets:
    enabled: true
    secretStore: aws-secrets-manager  # or vault, gcp-secrets, etc.
    secrets:
      - name: DB_PASSWORD
        remoteRef: /prod/auth-service/db-password
      - name: JWT_PRIVATE_KEY
        remoteRef: /prod/auth-service/jwt-private-key

  livenessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: true

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    # For AWS: eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/auth-service-role

postgresql:
  enabled: false  # Use managed database in production (RDS, Cloud SQL, etc.)
  # External database configuration via env vars

# JWT Key Rotation Configuration
keyRotation:
  # Enable CronJob as backup to in-app scheduler
  cronJob:
    enabled: true
    schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM

# Network Policy
networkPolicy:
  enabled: true

# Pod Security Standards
podSecurityPolicy:
  enabled: true
  spec:
    privileged: false
    allowPrivilegeEscalation: false
    requiredDropCapabilities:
      - ALL
    volumes:
      - 'configMap'
      - 'emptyDir'
      - 'projected'
      - 'secret'
      - 'downwardAPI'
    hostNetwork: false
    hostIPC: false
    hostPID: false
    runAsUser:
      rule: 'MustRunAsNonRoot'
    seLinux:
      rule: 'RunAsAny'
    fsGroup:
      rule: 'RunAsAny'
    readOnlyRootFilesystem: true
