services:
  # PostgreSQL Database for Auth Service (Simulates RDS for local development)
  auth-db:
    image: postgres:18-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with backend postgres (5432)
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  auth-db-data:
    driver: local
