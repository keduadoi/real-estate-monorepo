spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        spring.json.add.type.headers: false
        # Fail fast when the broker is down so analytics can never stall callers
        # (default max.block.ms is 60s)
        max.block.ms: 2000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8081

jwt:
  access-token:
    expiration: 900000      # 15 minutes
  refresh-token:
    expiration: 604800000   # 7 days
  issuer: auth-service
  audience: real-estate-api
  key-rotation:
    enabled: true
    max-key-age-days: 30    # Rotate keys older than 30 days
    grace-period-days: 7    # Keep old keys valid for 7 days after rotation
    cron: "0 0 2 * * ?"     # Run at 2 AM daily

security:
  password:
    min-length: 8
  account:
    max-failed-attempts: 5
    lock-duration-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Analytics Configuration
analytics:
  kafka:
    enabled: ${ANALYTICS_ENABLED:true}
    topic: user-activity-events
  service-name: auth-service
  event-mappings:
    "[POST /auth/register]": USER_REGISTER
    "[POST /auth/login]": USER_LOGIN
    "[POST /auth/refresh]": REFRESH_TOKEN
    "[POST /auth/logout]": USER_LOGOUT
    "[POST /auth/change-password]": CHANGE_PASSWORD
    "[POST /auth/forgot-password]": FORGOT_PASSWORD
    "[POST /auth/reset-password]": RESET_PASSWORD
    "[GET /auth/me]": VIEW_PROFILE
