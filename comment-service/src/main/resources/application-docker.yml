spring:
  application:
    name: comment-service
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:postgresql://${DB_HOST:comment-db}:${DB_PORT:5432}/${DB_NAME:commentsdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8087

comments:
  disabled: ${COMMENTS_DISABLED:false}
  ip-hash-secret: ${IP_HASH_SECRET:dev-only-rotate-me-in-prod-please}
  property-service:
    base-url: ${PROPERTY_SERVICE_URL:http://host.docker.internal:8080}

logging:
  level:
    com.realestate.comments: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
