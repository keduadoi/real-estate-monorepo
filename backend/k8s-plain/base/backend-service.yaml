apiVersion: v1
kind: Service
metadata:
  name: real-estate-backend-backend
  namespace: real-estate
  labels:
    app: real-estate-backend
    component: backend
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
      nodePort: 30080
  selector:
    app: real-estate-backend
    component: backend
