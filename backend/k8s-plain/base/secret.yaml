apiVersion: v1
kind: Secret
metadata:
  name: real-estate-backend-secret
  namespace: real-estate
  labels:
    app: real-estate-backend
type: Opaque
data:
  # Base64 encoded values
  # DB_USER: postgres (base64: cG9zdGdyZXM=)
  # DB_PASSWORD: postgres (base64: cG9zdGdyZXM=)
  # POSTGRES_USER: postgres (base64: cG9zdGdyZXM=)
  # POSTGRES_PASSWORD: postgres (base64: cG9zdGdyZXM=)
  # POSTGRES_DB: realestatedb (base64: cmVhbGVzdGF0ZWRi)
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: cG9zdGdyZXM=
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: cmVhbGVzdGF0ZWRi
