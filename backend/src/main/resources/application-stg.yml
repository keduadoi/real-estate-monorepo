# Staging Environment Configuration
spring:
  # JPA Configuration for Staging
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Flyway Configuration
  flyway:
    clean-disabled: true
    clean-on-validation-error: false
    validate-on-migrate: true
    out-of-order: false


# Server Configuration
server:
  port: 8080
  error:
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100

# Connection Pool Configuration
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      environment: staging
      application: ${spring.application.name}

# Logging Configuration for Staging
logging:
  level:
    root: WARN
    com.realestate.backend: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: logs/stg-application.log
    max-size: 100MB
    max-history: 60
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 60

# CORS Configuration for Staging
cors:
  allowed-origins: ${FRONTEND_URL:https://staging-realestate.example.com}

# Storage Configuration for Staging
storage:
  type: s3
  s3:
    bucket-name: ${S3_BUCKET_NAME:realestate-images-stg}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
