version: '3.8'

# =============================================================================
# Price Service - Standalone Docker Compose
# =============================================================================
# For development/testing of price-service in isolation
# Usage: docker-compose up -d
# =============================================================================

services:
  price-db:
    image: postgres:16-alpine
    container_name: price-db
    environment:
      POSTGRES_DB: pricedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - price-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  price-service:
    build:
      context: ..
      dockerfile: price-service/Dockerfile
    container_name: price-service
    ports:
      - "8084:8084"
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: price-db
      DB_PORT: 5432
      DB_NAME: pricedb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29093
    depends_on:
      price-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  price-db-data:
