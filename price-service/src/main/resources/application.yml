spring:
  application:
    name: price-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:pricedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        spring.json.add.type.headers: false
        # Fail fast when the broker is down so analytics can never stall callers
        # (default max.block.ms is 60s)
        max.block.ms: 2000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8084

grpc:
  server:
    port: 9090

logging:
  level:
    com.realestate.price: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      database:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.realestate.price.exception.PriceNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreaker-events
  endpoint:
    health:
      show-details: always

# Analytics Configuration
analytics:
  kafka:
    enabled: ${ANALYTICS_ENABLED:true}
    topic: user-activity-events
  service-name: price-service
  event-mappings:
    "[GET /api/prices/{propertyId}]": VIEW_PRICE
    "[GET /api/prices/{propertyId}/history]": VIEW_PRICE_HISTORY
    "[PUT /api/prices/{propertyId}]": UPDATE_PRICE
