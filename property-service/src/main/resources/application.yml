spring:
  application:
    name: real-estate-backend

  # Active Profile - Set via environment variable or command line
  # Example: -Dspring.profiles.active=dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:realestatedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Redis Configuration (cache for property listings, cities)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cache:
    type: redis

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        spring.json.add.type.headers: false

  # Multipart File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

# gRPC Client Configuration
grpc:
  client:
    price-service:
      address: static://${PRICE_SERVICE_GRPC_HOST:localhost}:${PRICE_SERVICE_GRPC_PORT:9090}
      negotiation-type: plaintext

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  error:
    include-message: always
    include-stacktrace: on-param

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      s3Storage:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      database:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      priceService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      s3Storage:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - software.amazon.awssdk.services.s3.model.S3Exception
          - java.io.IOException
        ignore-exceptions:
          - com.realestate.backend.exception.InvalidFileException
  timelimiter:
    instances:
      s3Storage:
        timeout-duration: 10s
  ratelimiter:
    instances:
      propertySearch:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s
      # Nominatim public endpoint policy: max 1 request per second.
      # See https://operations.osmfoundation.org/policies/nominatim/
      nominatim:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreaker-events,ratelimiters,retries,caches
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Common Logging Configuration
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# CORS Configuration
# Set cors.enabled=false when running behind Kong Gateway (Kong handles CORS)
cors:
  enabled: ${CORS_ENABLED:true}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# File Upload Configuration
file-upload:
  allowed-types: image/jpeg,image/png,image/webp
  max-file-size: 10485760  # 10MB in bytes
  max-files-per-property: 10

# Application Cache Configuration
# Set app.cache.enabled=false (or env CACHE_ENABLED=false) to disable Redis caching at runtime.
app:
  cache:
    enabled: ${CACHE_ENABLED:true}
    properties-list-ttl-seconds: 60
    cities-ttl-seconds: 3600

  # Map / geocoding configuration.
  # To switch providers, change `geocoding-provider` to `google` (or another impl
  # we add) and supply its credentials. No code changes required.
  maps:
    geocoding-provider: ${MAP_GEOCODING_PROVIDER:nominatim}
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      # Nominatim policy requires identifying the app with a real contact.
      user-agent: ${NOMINATIM_USER_AGENT:RealEstateApp/1.0 (contact@example.com)}
      accept-language: ${NOMINATIM_ACCEPT_LANGUAGE:vi,en}
    google:
      api-key: ${GOOGLE_MAPS_API_KEY:}

# Analytics Configuration
analytics:
  kafka:
    enabled: ${ANALYTICS_ENABLED:true}
    topic: user-activity-events
  service-name: property-service
  event-mappings:
    "[GET /api/properties]": BROWSE_PROPERTIES
    "[POST /api/properties/search]": SEARCH_PROPERTIES
    "[GET /api/properties/{id}]": VIEW_PROPERTY
    "[POST /api/properties]": CREATE_PROPERTY
    "[PUT /api/properties/{id}]": UPDATE_PROPERTY
    "[DELETE /api/properties/{id}]": DELETE_PROPERTY
    "[POST /api/upload/temp]": UPLOAD_IMAGE
    "[POST /api/properties/{id}/images]": UPLOAD_PROPERTY_IMAGE
    "[DELETE /api/properties/{id}/images]": DELETE_PROPERTY_IMAGE
    "[GET /api/properties/user]": VIEW_MY_PROPERTIES
    "[GET /api/properties/user/{userId}]": VIEW_USER_PROPERTIES
    "[GET /api/properties/cities]": GET_CITIES
    "[GET /api/properties/count/{status}]": COUNT_PROPERTIES
    "[HEAD /api/properties/{id}]": CHECK_PROPERTY_EXISTS
