# Production Environment Configuration
spring:
  # JPA Configuration for Production
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 30
        order_inserts: true
        order_updates: true
        generate_statistics: false
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 256

  # Flyway Configuration
  flyway:
    clean-disabled: true
    clean-on-validation-error: false
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false


# Server Configuration
server:
  port: 8080
  error:
    include-stacktrace: never
    include-binding-errors: never
    include-message: never
  shutdown: graceful
  tomcat:
    threads:
      max: 250
      min-spare: 25
    max-connections: 10000
    accept-count: 200
    connection-timeout: 20000
  compression:
    enabled: true
    min-response-size: 1024

# Connection Pool Configuration - Production optimized
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

# Actuator Configuration - Limited exposure for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      environment: production
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      hikaricp: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

# Logging Configuration for Production
logging:
  level:
    root: WARN
    com.realestate.backend: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: ${LOG_PATH:/var/log/realestate}/prod-application.log
    max-size: 100MB
    max-history: 90
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 90
      total-size-cap: 10GB
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# CORS Configuration for Production
# When behind Kong Gateway, disable CORS as Kong handles it
cors:
  enabled: ${CORS_ENABLED:false}
  allowed-origins: ${FRONTEND_URL:https://realestate.example.com},${FRONTEND_URL_WWW:https://www.realestate.example.com}

# Storage Configuration for Production
storage:
  type: s3
  s3:
    bucket-name: ${S3_BUCKET_NAME:realestate-images}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
