version: '3.8'

services:
  # PostgreSQL Database
  property-db:
    image: postgres:16-alpine
    container_name: property-db
    environment:
      POSTGRES_DB: realestatedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - property-db-data:/var/lib/postgresql/data
    networks:
      - property-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - cache for property listings, cities, and future use cases
  property-redis:
    image: redis:7-alpine
    container_name: property-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - property-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Spring Boot Property Service
  property-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: property-db
      DB_PORT: 5432
      DB_NAME: realestatedb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29093
      PRICE_SERVICE_GRPC_HOST: host.docker.internal
      PRICE_SERVICE_GRPC_PORT: 9090
      REDIS_HOST: property-redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      property-db:
        condition: service_healthy
      property-redis:
        condition: service_healthy
    networks:
      - property-service-network
    restart: unless-stopped

volumes:
  property-db-data:
    external: true
    name: backend_postgres_data

networks:
  property-service-network:
    driver: bridge
