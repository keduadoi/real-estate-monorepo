version: '3.8'

services:
  # PostgreSQL Database
  property-db:
    image: postgres:18-alpine
    container_name: property-db
    environment:
      POSTGRES_DB: realestatedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - property-db-data:/var/lib/postgresql/data
    networks:
      - property-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Property Service
  property-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: property-db
      DB_PORT: 5432
      DB_NAME: realestatedb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      property-db:
        condition: service_healthy
    networks:
      - property-service-network
    restart: unless-stopped

volumes:
  property-db-data:
    driver: local

networks:
  property-service-network:
    driver: bridge
