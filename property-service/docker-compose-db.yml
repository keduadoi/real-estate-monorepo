version: '3.8'

services:
  # PostgreSQL Database (Simulates RDS for local development)
  postgres:
    image: postgres:18-alpine
    container_name: property-db
    environment:
      POSTGRES_DB: realestatedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"  # Expose to host for K8s backend to connect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
