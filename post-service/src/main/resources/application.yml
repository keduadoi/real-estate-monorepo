spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        spring.json.add.type.headers: false

server:
  port: 8082

logging:
  level:
    com.realestate.post: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      database:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  ratelimiter:
    instances:
      postSearch:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s
      postFeed:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreaker-events,ratelimiters
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Analytics Configuration
analytics:
  kafka:
    enabled: ${ANALYTICS_ENABLED:true}
    topic: user-activity-events
  service-name: post-service
  event-mappings:
    "[GET /api/posts]": BROWSE_FEED
    "[GET /api/posts/{id}]": VIEW_POST
    "[POST /api/posts]": CREATE_POST
    "[PUT /api/posts/{id}]": UPDATE_POST
    "[DELETE /api/posts/{id}]": DELETE_POST
    "[POST /api/posts/{id}/like]": TOGGLE_LIKE
    "[GET /api/posts/search]": SEARCH_POSTS
    "[GET /api/posts/me]": VIEW_MY_POSTS
    "[GET /api/posts/user/{userId}]": VIEW_USER_POSTS
    "[HEAD /api/posts/{id}]": CHECK_POST_EXISTS
