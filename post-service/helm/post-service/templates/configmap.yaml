apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "post-service.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "post-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.postService.env.springProfile | quote }}
  SERVER_PORT: {{ .Values.postService.env.serverPort | quote }}
  DB_HOST: {{ .Values.postService.env.dbHost | quote }}
  DB_PORT: {{ .Values.postService.env.dbPort | quote }}
  DB_NAME: {{ .Values.postService.env.dbName | quote }}
  AUTH_SERVICE_URL: {{ .Values.postService.env.authServiceUrl | quote }}
