# Default values for post-service
# This is a YAML-formatted file.

# Namespace
namespace:
  name: real-estate
  create: false  # Use existing namespace

# Post Service Configuration
postService:
  name: post-service
  replicaCount: 1

  image:
    repository: post-service
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # Environment variables
  env:
    springProfile: prod
    serverPort: 8082

    # Database configuration
    dbHost: post-postgres
    dbPort: 5432
    dbName: postdb
    dbUser: postgres
    dbPassword: postgres

    # Auth service URL (for fetching user info if needed)
    authServiceUrl: http://auth-service:8081

  # Health check probes
  livenessProbe:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8082
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8082
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # HPA configuration
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget
  pdb:
    enabled: false
    minAvailable: 1

# PostgreSQL for post-service
postgresql:
  enabled: true
  name: post-postgres
  auth:
    database: postdb
    username: postgres
    password: postgres
