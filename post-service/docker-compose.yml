version: '3.8'

# =============================================================================
# Post Service - Standalone Docker Compose
# =============================================================================
# For development/testing of post-service in isolation
# Usage: docker-compose up -d
# =============================================================================

services:
  post-db:
    image: postgres:16-alpine
    container_name: post-db
    environment:
      POSTGRES_DB: postdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - post-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  post-service:
    build: .
    container_name: post-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: post-db
      DB_PORT: 5432
      DB_NAME: postdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      post-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  post-db-data:
