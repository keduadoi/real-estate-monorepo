apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.kong.name }}-migrations
  namespace: {{ .Values.namespace.name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: {{ .Values.kong.name }}-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ .Values.kong.env.pgHost }} {{ .Values.kong.env.pgPort }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: kong-migrations
          image: "{{ .Values.kong.image.repository }}:{{ .Values.kong.image.tag }}"
          command: ["kong", "migrations", "bootstrap"]
          envFrom:
            - configMapRef:
                name: {{ .Values.kong.name }}-config
            - secretRef:
                name: {{ .Values.kong.name }}-secret
