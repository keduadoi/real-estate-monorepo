# Production values for Kong Gateway
# High availability, security hardening, and performance tuning

namespace:
  name: kong
  create: true

kong:
  name: kong
  replicaCount: 3  # Minimum 3 for HA

  image:
    repository: kong
    tag: "3.5"
    pullPolicy: IfNotPresent

  env:
    database: postgres
    pgHost: kong-postgres
    pgPort: "5432"
    pgDatabase: kong
    pgUser: kong
    # pgPassword should be set via secret in production
    proxyAccessLog: /dev/stdout
    adminAccessLog: /dev/stdout
    proxyErrorLog: /dev/stderr
    adminErrorLog: /dev/stderr
    plugins: bundled,prometheus

    # ======================
    # PERFORMANCE TUNING
    # ======================

    # Nginx worker configuration
    nginxWorkerProcesses: auto  # Matches CPU cores
    nginxWorkerConnections: "16384"  # Max connections per worker
    nginxWorkerRlimitNofile: "65536"  # File descriptor limit

    # Proxy timeouts
    nginxProxyReadTimeout: "60s"
    nginxProxyConnectTimeout: "10s"
    nginxProxySendTimeout: "60s"

    # Upstream keepalive
    upstreamKeepalive: "60"  # Keep connections alive to upstreams
    upstreamKeepalivePoolSize: "60"
    upstreamKeepaliveMaxRequests: "1000"
    upstreamKeepaliveIdleTimeout: "60s"

    # Database connection pool
    pgPoolSize: "30"  # PostgreSQL connection pool size

    # DNS caching
    dnsNotFoundTtl: "1"  # Cache DNS not found results for 1s
    dnsStaleTtl: "4"  # Use stale DNS for 4s
    dnsNoSync: "on"

    # Memory optimization
    memCacheSize: "128m"  # Response cache size

    # Latency injection (disable in production)
    latencyTokens: "on"

    # Real IP handling (for proper client IP behind load balancer)
    realIpHeader: "X-Forwarded-For"
    realIpRecursive: "on"

    # Security
    anonymousReports: "off"
    trustedIps: "0.0.0.0/0,::/0"  # Configure based on your load balancer
    headersUpstream: "off"  # Don't send Kong headers upstream

  proxy:
    type: LoadBalancer
    httpPort: 8000
    servicePort: 80
    tlsPort: 8443
    tlsServicePort: 443
    annotations:
      # AWS ALB annotations (uncomment if using AWS)
      # service.beta.kubernetes.io/aws-load-balancer-type: nlb
      # service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp

  admin:
    type: ClusterIP  # Never expose admin externally in production
    httpPort: 8001
    servicePort: 8001

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Anti-affinity to spread pods across nodes
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - kong
          topologyKey: kubernetes.io/hostname

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Topology spread for zone redundancy
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: kong

  livenessProbe:
    httpGet:
      path: /status
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /status
      port: 8001
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

postgresql:
  enabled: true
  name: kong-postgres

  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  auth:
    database: kong
    username: kong
    # password should be set via external secret

  persistence:
    enabled: true
    storageClass: ""  # Use default or specify SSD storage class
    accessMode: ReadWriteOnce
    size: 10Gi

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Redis for distributed rate limiting (HA mode)
redis:
  enabled: true
  name: kong-redis
  replicas: 3  # Redis cluster for HA
  maxmemory: "512mb"

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# TLS Configuration
tls:
  enabled: true
  domain: api.yourdomain.com  # Replace with your actual domain
  additionalDomains: []
    # - api2.yourdomain.com
    # - api-staging.yourdomain.com

  # Use cert-manager for automatic certificate management
  certManager:
    enabled: true
    createIssuer: true  # Set to false if issuer already exists
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    email: admin@yourdomain.com  # Required for Let's Encrypt notifications

    # DNS provider for DNS-01 challenge (required for wildcard certs)
    # Leave empty to use HTTP-01 challenge
    dnsProvider: ""  # Options: route53, cloudflare, or empty for http01

    # Route53 configuration (if using AWS)
    route53:
      region: us-east-1
      hostedZoneID: ""  # Optional

    # Cloudflare configuration (if using Cloudflare)
    cloudflare:
      email: ""

  # Or specify existing secret (when certManager.enabled is false)
  # secretName: kong-tls-secret
