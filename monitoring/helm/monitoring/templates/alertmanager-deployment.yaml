{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alertmanager.name }}-config
  namespace: {{ .Values.namespace.name }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      {{- if .Values.alertmanager.smtp.enabled }}
      smtp_smarthost: '{{ .Values.alertmanager.smtp.host }}:{{ .Values.alertmanager.smtp.port }}'
      smtp_from: '{{ .Values.alertmanager.smtp.from }}'
      smtp_auth_username: '{{ .Values.alertmanager.smtp.username }}'
      smtp_auth_password: '{{ .Values.alertmanager.smtp.password }}'
      {{- end }}

    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-receiver'

    receivers:
      - name: 'default-receiver'
        {{- if .Values.alertmanager.slack.enabled }}
        slack_configs:
          - api_url: '{{ .Values.alertmanager.slack.webhookUrl }}'
            channel: '{{ .Values.alertmanager.slack.channel }}'
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }}" }} - {{ "{{ .CommonLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}'
        {{- end }}

      - name: 'critical-receiver'
        {{- if .Values.alertmanager.slack.enabled }}
        slack_configs:
          - api_url: '{{ .Values.alertmanager.slack.webhookUrl }}'
            channel: '{{ .Values.alertmanager.slack.criticalChannel | default .Values.alertmanager.slack.channel }}'
            send_resolved: true
            title: 'CRITICAL: {{ "{{ .CommonLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}'
            color: 'danger'
        {{- end }}
        {{- if .Values.alertmanager.smtp.enabled }}
        email_configs:
          - to: '{{ .Values.alertmanager.smtp.criticalRecipient }}'
            send_resolved: true
        {{- end }}

      - name: 'warning-receiver'
        {{- if .Values.alertmanager.slack.enabled }}
        slack_configs:
          - api_url: '{{ .Values.alertmanager.slack.webhookUrl }}'
            channel: '{{ .Values.alertmanager.slack.channel }}'
            send_resolved: true
            title: 'WARNING: {{ "{{ .CommonLabels.alertname }}" }}'
            text: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}'
            color: 'warning'
        {{- end }}

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.alertmanager.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.alertmanager.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.alertmanager.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.alertmanager.name }}
    spec:
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address="
          ports:
            - containerPort: 9093
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Values.alertmanager.name }}-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.alertmanager.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.alertmanager.name }}
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: web
  selector:
    app: {{ .Values.alertmanager.name }}
{{- end }}
